name: Renewal Main Server Develop Server CI/CD

on:
  pull_request:
    branches: [ "dev" ]
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  CI:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      ### application.yml 설정
      - name: Set YML
        run: |
          echo "${{ secrets.APPLICATION_DEV_YML }}" | base64 --decode > ./src/main/resources/application-dev.yml

      - name: Set private_key
        run: |
          echo "${{ secrets.AWS_EX_PRIVATE_KEY }}" > ./src/main/resources/aws/aws_ex_private_key.pem

      ### gradlew 실행 권한 부여
      - name: Grant execute Permission for gradlew
        run: |
          chmod +x gradlew

      ### project build
      - name: Build with Gradle
        run: |
          ./gradlew clean build -x test

      ### Docker Image Build and Push
      - name: Login to Docker Hub
        if: github.event.pull_request.merged == true
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: github.event.pull_request.merged == true
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        if: github.event.pull_request.merged == true
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dev.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_DEV_REPONAME }}

  # closed에 대한 server deploy
  CD:
    if: github.event.pull_request.merged == true
    needs: [CI]
    runs-on: ubuntu-22.04
    steps:
      - name: Determine Active Slot on Gateway
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_GATEWAY_SSH_HOST }}
          username: ${{ secrets.DEV_GATEWAY_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            ACTIVE=$(readlink /etc/nginx/sites-enabled/default | grep -Eo 'blue|green')
            echo "ACTIVE=$ACTIVE" >> $GITHUB_ENV
            if [ "$ACTIVE" = "blue" ]; then
              echo "NEXT=green" >> $GITHUB_ENV
            else
              echo "NEXT=blue"  >> $GITHUB_ENV
            fi

      - name: Deploy to Backend Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            # determine port
            if [ "$NEXT" = "blue" ]; then
            PORT=8080
            else
            PORT=8081
            fi

            # pull & run new container
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_DEV_REPONAME }}:latest
            docker run -d \
            --name api-$NEXT \
            -p $PORT:8080 \
            -v /etc/localtime:/etc/localtime:ro \
            -v /etc/timezone:/etc/timezone:ro \
            --network ${{ secrets.DOCKER_NETWORKNAME }} \
            -v /home/ubuntu/aws:/app/aws \
            --stop-timeout 60 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_DEV_REPONAME }}:latest
            
            # health check & grace
            until curl -sf http://localhost:$PORT/actuator/health; do sleep 2; done
            sleep 180


      - name: Update Nginx on Gateway Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_GATEWAY_SSH_HOST }}
          username: ${{ secrets.DEV_GATEWAY_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            ln -sf /etc/nginx/sites-available/api-$NEXT.conf /etc/nginx/sites-enabled/default
            nginx -t && nginx -s reload

      - name: Cleanup old container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            docker stop -t 60 api-$ACTIVE
            docker rm api-$ACTIVE
            docker image prune -f