name: Renewal Main Server Develop Server CI/CD

on:
  pull_request:
    branches: [ "dev" ]
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  CI:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      ### application.yml 설정
      - name: Set YML
        run: |
          echo "${{ secrets.APPLICATION_DEV_YML }}" | base64 --decode > ./src/main/resources/application-dev.yml

      - name: Set private_key
        run: |
          echo "${{ secrets.AWS_EX_PRIVATE_KEY }}" > ./src/main/resources/aws/aws_ex_private_key.pem

      ### gradlew 실행 권한 부여
      - name: Grant execute Permission for gradlew
        run: |
          chmod +x gradlew

      ### project build
      - name: Build with Gradle
        run: |
          ./gradlew clean build -x test

      ### Docker Image Build and Push
      - name: Login to Docker Hub
        if: github.event.pull_request.merged == true
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: github.event.pull_request.merged == true
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        if: github.event.pull_request.merged == true
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dev.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_DEV_REPONAME }}

  # closed에 대한 server deploy
  CD:
    if: github.event.pull_request.merged == true
    needs: [CI]
    runs-on: ubuntu-22.04
    steps:
      - name: Determine Active Slot on Gateway
        id: slot
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_GATEWAY_SSH_HOST }}
          username: ${{ secrets.DEV_GATEWAY_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            readlink /etc/nginx/sites-enabled/default | grep -Eo 'blue|green'

      - name: Set ACTIVE and NEXT env vars
        run: |
          ACTIVE="${{ steps.slot.outputs.stdout }}"
          echo "ACTIVE=$ACTIVE" >> $GITHUB_ENV
          if [ "$ACTIVE" = "blue" ]; then
            echo "NEXT=green" >> $GITHUB_ENV
          else
            echo "NEXT=blue"  >> $GITHUB_ENV
          fi

      - name: Deploy to Backend Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            # 포트 결정
            if [ "${{ env.NEXT }}" = "blue" ]; then
            PORT=8080
            else
            PORT=8081
            fi
            
            # Pull & run
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_DEV_REPONAME }}:latest
            docker run -d \
            --name api-${{ env.NEXT }} \
            -p $PORT:8080 \
            -v /etc/localtime:/etc/localtime:ro \
            -v /etc/timezone:/etc/timezone:ro \
            --network ${{ secrets.DOCKER_NETWORKNAME }} \
            -v /home/ubuntu/aws:/app/aws \
            --stop-timeout 5 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_DEV_REPONAME }}:latest

            for i in $(seq 1 30); do
            if curl -sf http://localhost:$PORT/actuator/health; then
            echo "service is healthy"
            break
            else
            echo "waiting for health ($i/30)…"
            sleep 2
            fi
            done
            if [ "$i" -ge 30 ]; then
            echo "health check failed after 60s"
            exit 1
            fi
            
            sleep 5
      - name: Update Nginx on Gateway Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_GATEWAY_SSH_HOST }}
          username: ${{ secrets.DEV_GATEWAY_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            sudo ln -sf /etc/nginx/sites-available/api-${{ env.NEXT }}.conf \
            /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Cleanup old container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            docker stop -t 5 api-${{ env.ACTIVE }}
            docker rm api-${{ env.ACTIVE }}
            docker image prune -f