spring:
  application:
    name: "TOOK-SCAN Test Server API"
  
  # === H2 인메모리 데이터베이스 설정 ===
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    hikari:
      pool-name: test-hikari-pool
      maximum-pool-size: 1

  # === JPA 테스트 설정 ===
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

  # === H2 콘솔 활성화 (테스트 시 디버깅용) ===
  h2:
    console:
      enabled: true
      path: /h2-console

  # === Redis 테스트 설정 (임베디드 Redis 사용) ===
  data:
    redis:
      host: localhost
      port: 6370  # 테스트용 포트 (기본 6379와 충돌 방지)

  # === 메일 테스트 설정 (Mock 사용) ===
  mail:
    host: localhost
    port: 25
    username: test@test.com
    password: testpassword

  # === 파일 업로드 테스트 설정 ===
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# === 테스트용 더미 설정 ===
