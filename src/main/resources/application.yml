spring:
  application:
    name: "TOOK-SCAN Main Server API"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # === DataSource 공통 설정 ===
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: jpa-hikari-pool
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
      jdbc-url: ${spring.datasource.url}
      username: ${spring.datasource.username}
      password: ${spring.datasource.password}
      data-source-properties:
        rewriteBatchedStatements: true

  # === JPA 공통 설정 ===
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${SPRING_JPA_SHOW_SQL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        current_session_context_class: org.springframework.orm.hibernate5.SpringSessionContext
        default_batch_fetch_size: 100
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: true
    open-in-view: false

  # === Redis 공통 설정 ===
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  # === 스레드 풀 설정 ===
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: "scheduling-"

  # === OAuth2 Provider URI (공통) ===
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://accounts.google.com/o/oauth2/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
        registration:
          kakao:
            client-id: ${SPRING_OAUTH2_CLIENT_KAKAO_ID}
            client-secret: ${SPRING_OAUTH2_CLIENT_KAKAO_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${SPRING_OAUTH2_CLIENT_KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-name: kakao
          google:
            client-id: ${SPRING_OAUTH2_CLIENT_GOOGLE_ID}
            client-secret: ${SPRING_OAUTH2_CLIENT_GOOGLE_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${SPRING_OAUTH2_CLIENT_GOOGLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-name: google
            scope:
              - email
              - profile
          naver:
            client-id: ${SPRING_OAUTH2_CLIENT_NAVER_ID}
            client-secret: ${SPRING_OAUTH2_CLIENT_NAVER_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${SPRING_OAUTH2_CLIENT_NAVER_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-name: naver
            scope:
              - email
              - profile

  # === Mail (Gmail) 공통 설정 ===
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 10000
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

# === Web-Engine 공통 설정 ===
web-engine:
  server-url: ${WEB_ENGINE_SERVER_URL}
  client-url: ${WEB_ENGINE_CLIENT_URL}
  cookie-domain: ${WEB_ENGINE_COOKIE_DOMAIN}

# === JWT (JSON Web Token) 공통 설정 ===
json-web-token:
  secret-key: ${JWT_SECRET_KEY}
  temporary-token-expire-period: ${JWT_TEMPORARY_TOKEN_EXPIRE_PERIOD}
  access-token-expire-period: ${JWT_ACCESS_TOKEN_EXPIRE_PERIOD}
  refresh-token-expire-period: ${JWT_REFRESH_TOKEN_EXPIRE_PERIOD}

# === AWS 공통 설정 ===
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${S3_BUCKET}
      url: ${S3_URL}
      pdf:
        prefix: ${S3_PDF_PREFIX}
        expiration-seconds: ${S3_PDF_EXPIRATION_SECONDS}
      mail-template-images:
        url: ${S3_MAIL_TEMPLATE_URL}
      default-path: ${S3_DEFAULT_PATH}
    cloudfront:
      domain: ${CLOUDFRONT_DOMAIN}
      path: ${CLOUDFRONT_PATH}
      private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH}
      key-id: ${CLOUDFRONT_KEY_ID}

# === NCP(SMS) 공통 설정 ===
ncp:
  access-key: ${NCP_ACCESS_KEY}
  secret-key: ${NCP_SECRET_KEY}
  sms:
    url: ${NCP_SMS_URL}
    service-id: ${NCP_SMS_SERVICE_ID}
    sender: ${NCP_SMS_SENDER}

# === TookScan 배송 관련 공통 설정 ===
tookscan:
  delivery:
    picking-location: ${TOOKSCAN_DELIVERY_PICKING_LOCATION}
    sender-name: ${TOOKSCAN_DELIVERY_SENDER_NAME}
    sender-phone-number: ${TOOKSCAN_DELIVERY_SENDER_PHONE_NUMBER}
    sender-address: ${TOOKSCAN_DELIVERY_SENDER_ADDRESS}
    pickup-building-entry: ${TOOKSCAN_DELIVERY_PICKUP_BUILDING_ENTRY}

# === Toss Payments 공통 설정 ===
toss:
  payments:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    confirm-url: ${TOSS_PAYMENTS_CONFIRM_URL}
    refund-url: ${TOSS_PAYMENTS_REFUND_URL}

# === Delivery Tracker 공통 설정 ===
delivery-tracker:
  client-id: ${DELIVERY_TRACKER_CLIENT_ID}
  client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET}
  url: ${DELIVERY_TRACKER_URL}
  carrier-id: ${DELIVERY_TRACKER_CARRIER_ID}
  carrier-name: ${DELIVERY_TRACKER_CARRIER_NAME}

# === Solapi 공통 설정 ===
solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  url: ${SOLAPI_URL}
  pf-id: ${SOLAPI_PF_ID}
  template-id:
    create-order: ${SOLAPI_TEMPLATE_CREATE_ORDER}
    request-payment: ${SOLAPI_TEMPLATE_REQUEST_PAYMENT}
    request-scan: ${SOLAPI_TEMPLATE_REQUEST_SCAN}
    announce-scan-finish: ${SOLAPI_TEMPLATE_ANNOUNCE_SCAN_FINISH}
    announce-delivery: ${SOLAPI_TEMPLATE_ANNOUNCE_DELIVERY}
  sender: ${SOLAPI_SENDER}
  tip-url: ${SOLAPI_TIP_URL}
  payment-url: ${SOLAPI_PAYMENT_URL}
  order-detail-url: ${SOLAPI_ORDER_DETAIL_URL}
  order-waybill-url: ${SOLAPI_ORDER_WAYBILL_URL}
  user-post-way-1-url: ${SOLAPI_USER_POST_WAY_1_URL}
  user-post-way-2-url: ${SOLAPI_USER_POST_WAY_2_URL}
  post-price-url: ${SOLAPI_POST_PRICE_URL}


# === Admin 계정 공통 설정 ===
admin:
  id: ${ADMIN_ID}
  password: ${ADMIN_PASSWORD}

# === Rest Client 공통 설정 ===
rest:
  client:
    connection-timeout: 2
    read-timeout: 2

# === Slack Webhook 공통 설정 ===
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}

# === AES 암호화 공통 설정 ===
aes-key: ${AES_KEY}

# === Swagger 공통 설정 ===
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
  show-login-endpoint: true

