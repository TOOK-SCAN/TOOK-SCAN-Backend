plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.tookscan'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

bootJar {
	archiveFileName.set "application.jar"
}

jar {
	enabled = false
}

dependencyManagement {
	imports {
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:3.3.0"
	}
}

dependencies {
    // AWS SDK BOM으로 버전 정합성 관리 (CRT 포함)
    implementation platform('software.amazon.awssdk:bom:2.29.52')
	// Health Check
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// Spring Boot Default
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// Spring Boot AOP
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// Spring Boot Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Spring Boot Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.google.code.findbugs:jsr305:3.0.2'

	// Spring Boot Data
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// MYSQL
	runtimeOnly 'com.mysql:mysql-connector-j'
	
	// H2 Database (for testing)
	testRuntimeOnly 'com.h2database:h2'

	// JWT
	implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

    // AWS
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'software.amazon.awssdk:cloudfront'
    implementation 'software.amazon.awssdk:s3-transfer-manager'
    implementation 'software.amazon.awssdk.crt:aws-crt:0.31.3'

	// TSID
	implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.8.1'

	// Apache POI
	implementation 'org.apache.poi:poi:5.2.3'
	implementation 'org.apache.poi:poi-ooxml:5.2.3'

	// Solapi
	implementation 'net.nurigo:sdk:4.3.2'

	// Slack Webhook
	implementation 'com.slack.api:slack-api-client:1.30.0'
	
	// ECS Logging
	implementation 'co.elastic.logging:logback-ecs-encoder:1.6.0'

	// Testing Dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// PDF
	implementation("org.apache.pdfbox:pdfbox:3.0.4") {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	implementation("org.bouncycastle:bcprov-jdk18on:1.80")
}

def generatedFiles = layout.buildDirectory.dir('generated/querydsl').get().asFile

tasks.withType(JavaCompile).configureEach {
	options.getGeneratedSourceOutputDirectory().set(file(generatedFiles))
}

sourceSets {
	main.java.srcDirs += [ generatedFiles ]
}

clean {
	delete file(generatedFiles)
}


tasks.named('test') {
	useJUnitPlatform()
}
